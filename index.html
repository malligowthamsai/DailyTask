<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Task</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">

        <div class="date">DATE/DAY</div>

        <div class="title">
            <h1>DAILY TASK</h1>
            <p>Display Time</p>
        </div>

        <div class="profile">
            <div class="circle"></div>
            <p>Your Name</p>
        </div>

    </header>

    <!-- MAIN SECTION -->
    <div class="main">

       <div class="calendar-box">

    <div class="calendar">

        <div class="calendar-header">
            <button id="prev">&#10094;</button>
            <h3 id="monthYear"></h3>
            <button id="next">&#10095;</button>
        </div>

        <div class="days">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div class="dates" id="dates"></div>

    </div>

</div>

        <!-- BUTTON SECTION -->
        <div class="actions">

            <div class="btn energy">Energy</div>

            <div class="btn screen">Screen Time</div>

            <div class="btn rule">Your Rule</div>

        </div>

    </div>

    <!-- BOTTOM SECTION -->
    <div class="bottom">

        <div class="pomodoro">
            <img src="apple.png" alt="pomodoro">
            <span>Pomodoro</span>
        </div>

        <div class="learn">
            What Have you done/ Learn Today
        </div>

        <p class="time-spent">Display Time you spend here</p>

    </div>

</div>

</body>
</html>
