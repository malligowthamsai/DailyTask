<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Life Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>

<div class="left">
<h2 id="todayDate"></h2>
</div>

<div class="center">
<h1>Daily Life Dashboard</h1>
<p id="clock"></p>
</div>

<div class="right">
<div class="profile"></div>
<p>Gowtham</p>
</div>

</header>

<main>

<section class="calendarSection">

<div class="calendarHeader">
<button id="prevMonth">‹</button>
<h3 id="monthYear"></h3>
<button id="nextMonth">›</button>
</div>

<div class="weekdays">
<div>SUN</div>
<div>MON</div>
<div>TUE</div>
<div>WED</div>
<div>THU</div>
<div>FRI</div>
<div>SAT</div>
</div>

<div id="calendarDays" class="calendarDays"></div>

</section>

<section class="actions">

<button class="action energy">Energy</button>
<button class="action screen">Screen Time</button>
<button class="action rule">Your Rule</button>
<button class="action learn">What You Learned Today</button>

</section>

</main>

<footer>

<p>Time spent here</p>
<h2 id="sessionTimer">00:00:00 </h2>

</footer>

</div>

<script src="script.js"></script>

</body>
</html>
