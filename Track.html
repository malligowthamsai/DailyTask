<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Tracker</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
background:linear-gradient(120deg,#c9f2d5,#a0bce8);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
padding:30px;
border-radius:20px;
width:350px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
text-align:center;
}

h1{
margin-bottom:15px;
}

select{
width:100%;
padding:10px;
border-radius:10px;
margin:10px 0;
}

.buttons button{
padding:10px 20px;
margin:10px;
border:none;
border-radius:20px;
cursor:pointer;
color:white;
font-size:16px;
}

.start{
background:linear-gradient(45deg,#5cc6a9,#7aa6ff);
}

.stop{
background:linear-gradient(45deg,#ff8c8c,#ffb36b);
}

#liveTimer{
font-size:26px;
margin:15px 0;
}

.log{
margin-top:15px;
text-align:left;
max-height:200px;
overflow-y:auto;
font-size:14px;
}

.entry{
margin-bottom:10px;
padding:8px;
background:#f5f7fb;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Activity Tracker</h1>

    <select id="taskType">
        <option>Productivity</option>
        <option>Social & Personal</option>
        <option>Sleep</option>
        <option>Entertainment</option>
    </select>

    <div class="buttons">
        <button class="start" onclick="startTask()">Start</button>
        <button class="stop" onclick="stopTask()">Stop</button>
    </div>

    <div id="liveTimer">00:00:00</div>

    <div class="log" id="log"></div>

</div>

<script>

let startTime = null;
let timerInterval;
let currentTask = "";

function startTask(){

    if(startTime !== null){
        alert("Task already running!");
        return;
    }

    currentTask = document.getElementById("taskType").value;
    startTime = new Date();

    timerInterval = setInterval(updateTimer,1000);
}

function stopTask(){

    if(startTime === null){
        alert("No active task!");
        return;
    }

    let endTime = new Date();
    clearInterval(timerInterval);

    let duration = Math.floor((endTime - startTime)/1000);

    logTask(currentTask,startTime,endTime,duration);

    startTime = null;
    document.getElementById("liveTimer").innerText = "00:00:00";
}

function updateTimer(){

    let now = new Date();
    let diff = Math.floor((now - startTime)/1000);

    let hrs = String(Math.floor(diff/3600)).padStart(2,"0");
    let mins = String(Math.floor((diff%3600)/60)).padStart(2,"0");
    let secs = String(diff%60).padStart(2,"0");

    document.getElementById("liveTimer").innerText = `${hrs}:${mins}:${secs}`;
}

function logTask(task,start,end,duration){

    let hrs = Math.floor(duration/3600);
    let mins = Math.floor((duration%3600)/60);

    let entry = document.createElement("div");
    entry.classList.add("entry");

    entry.innerHTML = `
        <strong>${task}</strong><br>
        ${start.toLocaleTimeString()} - ${end.toLocaleTimeString()}<br>
        ${hrs}h ${mins}m
    `;

    document.getElementById("log").appendChild(entry);
}

</script>

</body>
</html>
