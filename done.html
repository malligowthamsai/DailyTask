<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>What Have You Done Today</title>
  <style>
    body {
      font-family: Segoe UI, sans-serif;
      background: linear-gradient(120deg, #6dd5ed, #2193b0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .done-container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 500px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #ccc;
      resize: none;
      outline: none;
    }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(45deg, #ff6b6b, #ffb347);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .notes {
      margin-top: 20px;
      text-align: left;
    }
    .notes strong {
      display: block;
      margin-top: 10px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="done-container">
    <h2>What Have You Done Today?</h2>
    <textarea id="noteInput" placeholder="Write down your tasks..."></textarea>
    <button id="saveNote">Save Note</button>
    <div class="notes" id="notes"></div>
  </div>
